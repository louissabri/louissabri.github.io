<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Preview Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Roboto:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="margin: 0; padding: 0; background: white;">
    <div class="social-preview">
        <div class="social-preview-content">
            <h1 class="social-preview-title">Louis Sabri</h1>
            <p class="social-preview-subtitle">Computational Designer</p>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px;">
                <img src="img/table-1.png" alt="" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px;">
                <img src="img/rammed-earth-1.png" alt="" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px;">
                <img src="img/website-1.png" alt="" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px;">
            </div>
        </div>
    </div>
</body>
</html>
